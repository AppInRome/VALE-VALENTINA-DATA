name: Refresh public statistics
on:
  schedule:
    - cron: '20 5 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vale-public-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.VALE_ENABLE_ACTIONS == 'true' && vars.VALE_ENABLE_PUBLIC_REFRESH == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 validation/check.py
      - run: git diff --exit-code -- distribution/knowledge.tsv
      - run: python3 validation/refresh.py
      - name: Publish validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/external_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public Eurostat observations'
            git push origin HEAD:main
          fi
