name: Institutional acquisition diagnostics
on:
  pull_request:
    paths:
      - 'validation/assimilation.py'
      - '.github/workflows/assimilation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 validation/assimilation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-diagnostics
          path: assimilation-report.json
          retention-days: 7
